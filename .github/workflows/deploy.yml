# Builds the app and publishes it on GitHub Pages every time main is updated.
# The presentation (presentation branch) is published with it, under /presentation/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The presentation is one self-contained page: put it at /presentation/.
      - uses: actions/checkout@v4
        with:
          ref: presentation
          path: presentation-branch
      - run: mkdir -p dist/presentation && cp presentation-branch/index.html dist/presentation/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
